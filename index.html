<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KOSMOS Admin · 전자주총 운영관리 (프로토타입)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap">
<style>
:root{
  --primary:#0071F3; --primary-hover:#005FCC; --primary-soft:rgba(0,113,243,.08);
  --ink:#15191E; --ink-mute:#60646C; --ink-soft:#8B8D98; --ink-disabled:#B9BBC6;
  --canvas:#FCFCFD; --sunken:#F5F6F8;
  --hairline:rgba(66,87,138,.15); --hairline-strong:rgba(21,25,30,.3);
  --warning:#E8590C; --critical:#D92D20;
  --font:"Pretendard Variable",Pretendard,Inter,-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
  --sh-float:0 12px 20px -14px rgba(16,24,40,.09),0 4px 12px 2px rgba(16,24,40,.1),0 2px 4px -4px rgba(16,24,40,.14);
}
*{box-sizing:border-box}
html{scroll-padding-top:84px}
body{margin:0;font:400 14px/1.5 var(--font);letter-spacing:-.02em;color:var(--ink);background:var(--sunken);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:500;margin:0}
h1{font-size:24px;line-height:1.21} h2{font-size:20px;line-height:1.2} h3{font-size:14px}
a{color:var(--primary);text-decoration:none} a:hover{text-decoration:underline}
.mono{font-family:var(--mono);letter-spacing:0}
.mute{color:var(--ink-mute)} .soft{color:var(--ink-soft)} .right{text-align:right}
.cap{font-size:12px;font-weight:500;letter-spacing:.05em;color:var(--ink-mute);text-transform:uppercase}

/* 상단바 */
.top{position:sticky;top:0;z-index:10;height:60px;background:var(--canvas);border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:24px;padding:0 24px}
.brand{font-weight:500;font-size:16px;color:var(--ink);display:flex;align-items:center;gap:8px}
a.brand:hover{text-decoration:none}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.top .grow{flex:1}
.user{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink-mute)}
.user b{font-weight:500;color:var(--ink);font-size:14px}

/* 컨트롤 */
.btn{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--hairline);background:var(--canvas);color:var(--ink);font:400 14px/22px var(--font);letter-spacing:0;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--hairline-strong)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--canvas)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.danger{color:var(--critical)}
.btn.danger.fill{background:var(--critical);border-color:var(--critical);color:var(--canvas)}
.btn.sm{height:28px;padding:0 8px;border-radius:6px;font-size:12px;line-height:18px}
.btn:disabled{color:var(--ink-disabled);cursor:not-allowed}
input,select,textarea{height:36px;width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--hairline);background:var(--canvas);color:var(--ink);font:400 14px/1.5 var(--font);letter-spacing:-.02em;outline:0}
textarea{height:auto;min-height:96px;resize:vertical}
input:hover,select:hover,textarea:hover{border-color:var(--hairline-strong)}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink-soft)}
input:disabled,select:disabled,textarea:disabled{background:var(--sunken);color:var(--ink-mute)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:18px;height:18px;padding:0;border-radius:6px;border:1px solid var(--hairline-strong);background:var(--canvas);cursor:pointer;display:inline-grid;place-content:center;vertical-align:middle}
input[type=checkbox]:hover{border-color:var(--ink)}
input[type=checkbox]:checked{background:var(--primary);border-color:var(--primary)}
input[type=checkbox]:checked::after{content:"";width:9px;height:5px;border-left:1.5px solid var(--canvas);border-bottom:1.5px solid var(--canvas);transform:translateY(-1px) rotate(-45deg)}
input[type=checkbox]:focus-visible{outline:0;border-color:var(--ink)}
.x-hide{display:none!important}
/* 커스텀 컨트롤: 셀렉트·날짜·시간·파일 */
.ctl{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--hairline);background:var(--canvas);color:var(--ink);font:400 14px/1.5 var(--font);letter-spacing:-.02em;text-align:left;cursor:pointer}
.ctl:hover{border-color:var(--hairline-strong)}
.ctl:focus-visible,.ctl.open{outline:0;border-color:var(--ink)}
.ctl .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl .v.ph{color:var(--ink-soft)}
.ctl .v.mono{font-family:var(--mono);letter-spacing:0}
.ctl svg{flex:none;color:var(--ink-mute);transition:transform .15s ease-out}
.ctl.open svg.chev{transform:rotate(180deg)}
.ctl .tag{flex:none;font-size:12px;color:var(--ink-mute);border-left:1px solid var(--hairline);padding-left:10px}
.ctl:disabled,.ctl-w.dis{background:var(--sunken);color:var(--ink-mute);cursor:not-allowed}
.ctl-w{padding:0 4px 0 0;gap:0;cursor:text}
.ctl-w:focus-within{border-color:var(--ink)}
.ctl-w.bad,.ctl-w.bad:focus-within{border-color:var(--critical)}
.ctl .ctl-in{flex:1;min-width:0;width:auto;height:34px;border:0;border-radius:9px;background:none;padding:0 10px;font-family:var(--mono);letter-spacing:0}
.ctl .ctl-in::placeholder{font-family:var(--font);letter-spacing:-.02em}
.ctl-ic{flex:none;width:28px;height:28px;border:0;border-radius:6px;background:none;display:grid;place-content:center;cursor:pointer}
.ctl-ic:hover:not(:disabled){background:var(--primary-soft)}
.ctl-ic:disabled{cursor:not-allowed}
.modal-bg{position:fixed;inset:0;z-index:40;background:rgba(21,25,30,.4);display:grid;place-items:center;padding:24px}
.modal{width:480px;max-width:100%;background:var(--canvas);border-radius:12px;padding:24px;box-shadow:0 14px 20px -11px rgba(16,24,40,.16),0 6px 20px 4px rgba(16,24,40,.12),0 4px 8px -8px rgba(16,24,40,.14)}
.modal p{margin:8px 0 0}
form.dirty .btn.primary{box-shadow:0 0 0 3px var(--primary-soft)}
.ctl:disabled:hover{border-color:var(--hairline)}
.pop{position:fixed;z-index:30;background:var(--canvas);border:1px solid var(--hairline);border-radius:10px;box-shadow:var(--sh-float);padding:4px;font:400 14px/1.5 var(--font);letter-spacing:-.02em;color:var(--ink)}
.pop .list{max-height:320px;overflow:auto}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.opt:hover,.opt.act{background:var(--primary-soft)}
.opt.sel{color:var(--primary)}
.opt.sel::after{content:"";width:9px;height:5px;border-left:1.5px solid var(--primary);border-bottom:1.5px solid var(--primary);transform:translateY(-2px) rotate(-45deg);flex:none}
.grp{padding:10px 10px 4px;font-size:12px;font-weight:500;color:var(--ink-mute)}
.cal{padding:8px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:500}
.cal-h button,.cal-g button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;border-radius:6px}
.cal-h button{width:28px;height:28px;color:var(--ink-mute);display:grid;place-content:center}
.cal-h button:hover,.cal-g button:hover{background:var(--primary-soft)}
.cal-g{display:grid;grid-template-columns:repeat(7,36px)}
.cal-g span{height:28px;line-height:28px;text-align:center;font-size:12px;font-weight:500;color:var(--ink-mute)}
.cal-g button{height:36px;font-family:var(--mono);letter-spacing:0;font-size:13px}
.cal-g button.out{color:var(--ink-disabled)}
.cal-g button.today{box-shadow:inset 0 0 0 1px var(--hairline-strong)}
.cal-g button.sel,.cal-g button.sel:hover{background:var(--primary);color:var(--canvas);box-shadow:none}
.pop-f{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--hairline);margin-top:8px;padding-top:8px}
.tm{display:flex;gap:4px;padding:4px}
.tm .col{width:76px}
.tm .col .list{max-height:216px}
.tm .cap{display:block;padding:4px 10px 6px}
.tm .opt{justify-content:center;font-family:var(--mono);letter-spacing:0}
.tm .opt.sel{background:var(--primary);color:var(--canvas)}
.tm .opt.sel::after{display:none}
input.num{font-family:var(--mono);letter-spacing:0;text-align:right}
label.f{display:block}
label.f>span{display:block;font-size:12px;color:var(--ink-mute);margin-bottom:4px}
.err{color:var(--critical);font-size:12px;margin-top:8px}
.err:empty{display:none}

/* 레이아웃 */
.page{max-width:1200px;margin:0 auto;padding:32px 24px 72px}
.card{background:var(--canvas);border:1px solid var(--hairline);border-radius:12px;padding:24px}
.card+.card{margin-top:16px}
.card>h3{margin-bottom:16px}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.row>*{flex:1;min-width:120px} .row>.fix{flex:0 0 auto;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* 테이블 */
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:500;letter-spacing:.05em;color:var(--ink-mute);text-align:left;background:var(--sunken);padding:0 12px;height:36px;white-space:nowrap}
th:first-child{border-radius:6px 0 0 6px} th:last-child{border-radius:0 6px 6px 0}
td{padding:0 12px;height:44px;border-bottom:1px solid var(--hairline);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.link{cursor:pointer} tr.link:hover td{background:var(--primary-soft)}
td.wrap{white-space:pre-wrap;padding-top:10px;padding-bottom:10px;height:auto}
td .btn+.btn{margin-left:4px}
.empty{padding:32px;text-align:center;color:var(--ink-soft)}

/* 배지 */
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;line-height:18px;border:1px solid var(--hairline);color:var(--ink-mute);white-space:nowrap}
.badge.blue{border-color:var(--primary);color:var(--primary)}
.badge.warn{border-color:var(--warning);color:var(--warning)}
.done{color:var(--ink-mute)}
.done::before{content:"✓ "}

/* 탭 */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--hairline);margin:24px 0}
.tabs a{padding:10px 0;color:var(--ink-mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a:hover{text-decoration:none;color:var(--ink)}
.tabs a.on{color:var(--ink);border-bottom-color:var(--primary)}

.nav{display:flex;gap:20px;margin-left:8px}
.nav a{color:var(--ink-mute);padding:19px 0;border-bottom:2px solid transparent}
.nav a:hover{color:var(--ink);text-decoration:none}
.nav a.on{color:var(--ink);border-bottom-color:var(--primary)}
.chg{display:flex;align-items:baseline;gap:8px;padding:2px 0;flex-wrap:wrap}
.chg .old{color:var(--ink-soft);text-decoration:line-through}
.chg label{display:inline-flex;align-items:center;gap:6px;color:var(--warning);font-size:12px;cursor:pointer}
.stat{display:flex;gap:24px;margin-bottom:16px}
.stat div b{display:block;font:400 20px var(--mono);letter-spacing:0}
.stat div span{font-size:12px;color:var(--ink-mute)}
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
/* 기타 */
.demo{background:var(--canvas);border-bottom:1px solid var(--hairline);padding:6px 24px;font-size:12px;color:var(--ink-mute);display:flex;gap:8px;align-items:center}
.login{max-width:400px;margin:96px auto;padding:0 24px}
.login .card{padding:32px}
.acct{display:flex;justify-content:space-between;align-items:center;width:100%;height:auto;padding:12px;text-align:left;margin-top:8px}
.acct small{color:var(--ink-mute);display:block}
.note{border:1px solid var(--hairline);border-radius:10px;padding:12px 16px}
.note+.note{margin-top:8px}
.note p{margin:4px 0 8px;white-space:pre-wrap}
.note .meta{font-size:12px;color:var(--ink-soft)}
.total{display:flex;justify-content:flex-end;align-items:baseline;gap:16px;padding:16px 12px 0;border-top:1px solid var(--hairline-strong);margin-top:8px}
.total b{font:400 20px var(--mono);letter-spacing:0}
.chk{display:flex;align-items:center;gap:12px;min-height:44px;border-bottom:1px solid var(--hairline)}
.chk:last-child{border-bottom:0}
.chk .t{flex:1} .chk.on .t{color:var(--ink-mute)}
.bar{height:4px;background:var(--sunken);border-radius:9999px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--primary)}
.prog{display:flex;align-items:center;gap:8px}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--canvas);border:1px solid var(--hairline);border-radius:10px;box-shadow:var(--sh-float);padding:10px 16px;z-index:20}
@media(max-width:800px){.grid2,.grid4{grid-template-columns:1fr}.tabs{overflow-x:auto;white-space:nowrap}}
</style>
</head>

  return ui.confirm===k?`<button class="btn sm danger fill" data-act="del" data-kind="${kind}" data-id="${id}">삭제 확인</button><button class="btn sm" data-act="cancel">취소</button>`
                       :`<button class="btn sm danger" data-act="ask" data-key="${k}">삭제</button>`}
const editing=(kind,list)=>ui.edit&&ui.edit.kind===kind?list.find(x=>x.id===ui.edit.id):null;


/* ---------- 커스텀 컨트롤 (네이티브 셀렉트·달력·시간·파일 대체) ---------- */
const svg=(cls,d)=>`<svg class="${cls}" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON={chev:svg('chev','<path d="M4 6l4 4 4-4"/>'),cal:svg('ic','<rect x="2.5" y="3.5" width="11" height="10" rx="2"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/>'),
  clock:svg('ic','<circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5"/>'),prev:svg('ic','<path d="M10 4L6 8l4 4"/>'),next:svg('ic','<path d="M6 4l4 4-4 4"/>')};
let pop=null;
function closePop(){if(!pop)return;pop.el.remove();pop.trigger.classList.remove('open');pop=null}
function placePop(){if(!pop)return;const r=pop.trigger.getBoundingClientRect(),el=pop.el;if(pop.fit)el.style.minWidth=r.width+'px';
  const h=el.offsetHeight,w=el.offsetWidth;el.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';
  el.style.top=(innerHeight-r.bottom<h+12&&r.top>h+12?r.top-h-4:r.bottom+4)+'px'}
function openPop(trigger,fit,build){const same=pop&&pop.trigger===trigger;closePop();if(same)return;
  const el=document.createElement('div');el.className='pop';document.body.appendChild(el);pop={el,trigger,fit};trigger.classList.add('open');build(el);placePop()}
function setVal(inp,v){inp.value=v;inp.dispatchEvent(new Event('change',{bubbles:true}))}
function mkCtl(inp,icon,mono){const b=document.createElement('button');b.type='button';b.className='ctl';b.disabled=inp.disabled;
  b.innerHTML=`<span class="v${mono?' mono':''}"></span>${icon}`;inp.classList.add('x-hide');inp.after(b);return b}
const p2=n=>String(n).padStart(2,'0');
function mkPick(inp,icon,hint){const w=document.createElement('div');w.className='ctl ctl-w'+(inp.disabled?' dis':'');
  w.innerHTML=`<input class="ctl-in" type="text" placeholder="미정" title="${hint}" autocomplete="off"${inp.disabled?' disabled':''}><button type="button" class="ctl-ic" aria-label="선택 창 열기"${inp.disabled?' disabled':''}>${icon}</button>`;
  w.txt=w.firstChild;w.btn=w.lastChild;w.focus=()=>w.txt.focus();inp.classList.add('x-hide');inp.after(w);
  w.txt.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();w.btn.click()}else if(e.key.length===1)closePop()});return w}

function enhance(){
  closePop();
  document.querySelectorAll('select:not(.x-hide)').forEach(sel=>{
    const b=mkCtl(sel,ICON.chev),v=b.firstChild;
    const sync=()=>{const o=sel.selectedOptions[0];v.textContent=o?o.textContent:'';v.classList.toggle('ph',!sel.value)};sync();
    b.onclick=()=>openPop(b,true,el=>{
      let h='<div class="list" role="listbox">';
      [...sel.children].forEach(c=>{if(c.tagName==='OPTGROUP'){h+=`<div class="grp">${esc(c.label)}</div>`;[...c.children].forEach(o=>h+=row(o))}else h+=row(c)});
      function row(o){return o.value===''?'':`<div class="opt${o.value===sel.value?' sel act':''}" role="option" data-v="${esc(o.value)}">${esc(o.textContent)}</div>`}
      el.innerHTML=h+'</div>';el.querySelector('.sel')?.scrollIntoView({block:'nearest'});
      el.onclick=e=>{const o=e.target.closest('.opt');if(!o)return;setVal(sel,o.dataset.v);sync();closePop();b.focus()}});
  });
  document.querySelectorAll('input[type=date]:not(.x-hide)').forEach(inp=>{
    const b=mkPick(inp,ICON.cal,'직접 입력: 2027.03.19 또는 20270319'),txt=b.txt;
    const sync=()=>{txt.value=inp.value?inp.value.replaceAll('-','.'):'';b.classList.remove('bad')};sync();
    txt.addEventListener('change',()=>{const v=txt.value.trim();if(!v){setVal(inp,'');sync();return}const d=normDate(v);if(d){setVal(inp,d);sync()}else b.classList.add('bad')});
    b.btn.onclick=()=>openPop(b,false,el=>{
      const now=new Date(),today=`${now.getFullYear()}-${p2(now.getMonth()+1)}-${p2(now.getDate())}`;
      let [y,mo]=(inp.value||today).split('-').map(Number);
      const draw=()=>{const first=new Date(y,mo-1,1),start=new Date(y,mo-1,1-first.getDay());let g='';
        for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
          g+=`<button type="button" data-d="${k}" class="${d.getMonth()!==mo-1?'out ':''}${k===today?'today ':''}${k===inp.value?'sel':''}">${d.getDate()}</button>`}
        el.innerHTML=`<div class="cal"><div class="cal-h"><button type="button" data-nav="-1" aria-label="이전 달">${ICON.prev}</button><span>${y}년 ${mo}월</span><button type="button" data-nav="1" aria-label="다음 달">${ICON.next}</button></div>
          <div class="cal-g">${['일','월','화','수','목','금','토'].map(w=>`<span>${w}</span>`).join('')}${g}</div>
          <div class="pop-f"><button type="button" class="btn sm" data-d="">미정으로 비우기</button><button type="button" class="btn sm" data-d="${today}">오늘</button></div></div>`};
      draw();
      el.onclick=e=>{const n=e.target.closest('[data-nav]'),d=e.target.closest('[data-d]');
        if(n){mo+=+n.dataset.nav;if(mo<1){mo=12;y--}if(mo>12){mo=1;y++}draw();placePop()}
        else if(d){setVal(inp,d.dataset.d);sync();closePop();b.focus()}}});
  });
  document.querySelectorAll('input[type=time]:not(.x-hide)').forEach(inp=>{
    const b=mkPick(inp,ICON.clock,'직접 입력: 09:30 또는 0930'),txt=b.txt;
    const sync=()=>{txt.value=inp.value||'';b.classList.remove('bad')};sync();
    txt.addEventListener('change',()=>{const v=txt.value.trim();if(!v){setVal(inp,'');sync();return}const t=normTime(v);if(t){setVal(inp,t);sync()}else b.classList.add('bad')});
    b.btn.onclick=()=>openPop(b,false,el=>{
      const draw=()=>{const [h,mi]=inp.value?inp.value.split(':'):[null,null];
        el.innerHTML=`<div class="tm"><div class="col"><span class="cap">시</span><div class="list">${Array.from({length:24},(_,i)=>`<div class="opt${p2(i)===h?' sel':''}" data-h="${p2(i)}">${p2(i)}</div>`).join('')}</div></div>
          <div class="col"><span class="cap">분</span><div class="list">${Array.from({length:12},(_,i)=>`<div class="opt${p2(i*5)===mi?' sel':''}" data-m="${p2(i*5)}">${p2(i*5)}</div>`).join('')}</div></div></div>
          <div class="pop-f" style="margin:0 4px 4px"><button type="button" class="btn sm" data-clear>미정으로 비우기</button><button type="button" class="btn sm" data-ok>확인</button></div>`;
        el.querySelectorAll('.sel').forEach(x=>x.scrollIntoView({block:'center'}))};
      draw();
      el.onclick=e=>{const t=e.target,[h,mi]=inp.value?inp.value.split(':'):['09','00'];
        if(t.dataset.h){setVal(inp,t.dataset.h+':'+(inp.value?mi:'00'));sync();draw()}
        else if(t.dataset.m){setVal(inp,h+':'+t.dataset.m);sync();closePop();b.focus()}
        else if(t.closest('[data-clear]')){setVal(inp,'');sync();closePop();b.focus()}
        else if(t.closest('[data-ok]')){closePop();b.focus()}}});
  });
  document.querySelectorAll('input[type=file]:not(.x-hide)').forEach(inp=>{
    const b=mkCtl(inp,'<span class="tag">찾아보기</span>'),v=b.firstChild;
    const sync=()=>{const f=inp.files[0];v.textContent=f?f.name:'선택된 파일 없음';v.classList.toggle('ph',!f)};sync();
    b.onclick=()=>inp.click();inp.addEventListener('change',sync);
  });
}
document.addEventListener('mousedown',e=>{if(pop&&!pop.el.contains(e.target)&&!pop.trigger.contains(e.target))closePop()});
addEventListener('scroll',e=>{if(pop&&!(e.target instanceof Node&&pop.el.contains(e.target)))closePop()},true);
addEventListener('resize',closePop);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.modal-bg')){document.querySelector('.modal-bg').remove();return}if(!pop)return;
  if(e.key==='Escape'){const t=pop.trigger;closePop();t.focus();return}
  const opts=[...pop.el.querySelectorAll('[role=listbox] .opt')];if(!opts.length)return;
  let i=opts.findIndex(o=>o.classList.contains('act'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();opts[i]?.classList.remove('act');i=e.key==='ArrowDown'?Math.min(opts.length-1,i+1):Math.max(0,i-1);opts[i].classList.add('act');opts[i].scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'&&i>=0){e.preventDefault();opts[i].click()}});

/* ---------- 라우팅 ---------- */
function route(){const h=location.hash.replace(/^#\/?/,'').split('/');return h[0]==='c'?{cid:+h[1],tab:h[2]||'basic'}:h[0]==='import'||h[0]==='accounts'?{page:h[0]}:{}}
let curHash=location.hash;
const isDirty=()=>!!document.querySelector('form.dirty');
const clearDirty=()=>document.querySelectorAll('form.dirty').forEach(f=>f.classList.remove('dirty'));
function askLeave(go){closePop();document.querySelector('.modal-bg')?.remove();const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h2>저장하지 않은 내용이 있습니다</h2><p class="mute">이 화면을 벗어나면 입력 중인 내용이 사라집니다.</p>
    <div class="actions"><button class="btn danger" data-leave="go">저장하지 않고 이동</button><button class="btn primary" data-leave="stay">계속 입력</button></div></div>`;
  document.body.appendChild(bg);bg.querySelector('[data-leave=stay]').focus();
  bg.onclick=e=>{const b=e.target.closest('[data-leave]');if(!b&&e.target!==bg)return;bg.remove();if(b&&b.dataset.leave==='go'){clearDirty();go()}}}
addEventListener('hashchange',()=>{
  if(isDirty()){const to=location.hash;history.replaceState(null,'',curHash||'#/');askLeave(()=>{location.hash=to});return}
  curHash=location.hash;ui.edit=null;ui.confirm=null;ui.agp=null;render();scrollTo(0,0)});
addEventListener('beforeunload',e=>{if(isDirty()){e.preventDefault();e.returnValue=''}});
document.addEventListener('input',e=>{const f=e.target.closest&&e.target.closest('form[data-form]');if(f&&!['login','import'].includes(f.dataset.form))f.classList.add('dirty')});
document.addEventListener('change',e=>{const f=e.target.closest&&e.target.closest('form[data-form]');if(f&&!['login','import'].includes(f.dataset.form)&&e.target.dataset.map===undefined)f.classList.add('dirty')});

function render(){
  const app=document.getElementById('app');
  closePop();
  const keep=[...document.querySelectorAll('form.dirty')].map(f=>[f.dataset.form,[...f.elements].filter(x=>x.name&&x.type!=='file').map(x=>[x.name,x.value])]);
  if(!user){app.innerHTML=viewLogin();return}
  const r=route();
  const body=r.page==='import'&&can.irk()?viewImport():r.page==='accounts'&&can.admin()?viewAccounts():r.cid&&co(r.cid)&&can.seeCompany(r.cid)?viewDetail(r):r.cid?`<div class="page"><div class="card empty">접근 권한이 없거나 없는 기업입니다. <a href="#/">기업 목록으로</a></div></div>`:viewList();
  app.innerHTML=`<div class="top"><a class="brand" href="#/"><i></i>KOSMOS Admin</a><nav class="nav"><a href="#/" class="${!r.page?'on':''}">기업 목록</a>${can.irk()?`<a href="#/import" class="${r.page==='import'?'on':''}">가져오기</a>`:''}${can.admin()?`<a href="#/accounts" class="${r.page==='accounts'?'on':''}">계정 관리</a>`:''}</nav><span class="grow"></span>
    <div class="user"><span><b>${esc(user.name)}</b> · ${esc(user.label)}</span><button class="btn sm" data-act="logout">로그아웃</button></div></div>
    <div class="demo"><span class="badge warn">시연용</span>입력한 내용은 이 브라우저에만 저장됩니다. 실제 DB와 연결되어 있지 않습니다.<span class="grow" style="flex:1"></span><button class="btn sm" data-act="reset">입력 내용 초기화</button></div>${body}`;
  keep.forEach(([n,vals])=>{const f=document.querySelector(`form[data-form="${n}"]`);if(!f)return;vals.forEach(([k,v])=>{const x=f.elements[k];if(x&&!x.disabled)x.value=v});f.classList.add('dirty')});
  enhance();curHash=location.hash;
}

/* ---------- 입력 처리 ---------- */
const intOr=(v,min)=>{v=String(v).replace(/[,\s]/g,'');if(v==='')return '';return /^\d+$/.test(v)&&+v>=min?+v:null};
const SUBMIT={
  basic(f,m){const n=intOr(f.shareholders,0);if(n===null)return '예상 주주수는 0 이상의 정수로 입력해 주세요.';
    Object.assign(m,{date:f.date,time:f.time,address:f.address.trim(),addressDetail:f.addressDetail.trim(),notes:f.notes,shareholders:n})},
  schedule(f,m){m.date=f.date;m.time=f.time;Object.assign(m.sched,{pre_d:f.pre_d,mock_d:f.mock_d,mock_t:f.mock_t,reh_d:f.reh_d,reh_t:f.reh_t})},
  contact(f,m){if(!f.name.trim())return '담당자명을 입력해 주세요.';if(!f.phone.trim()&&!f.email.trim())return '연락처와 이메일 중 하나는 입력해 주세요.';
    if(f.email.trim()&&!/^\S+@\S+\.\S+$/.test(f.email.trim()))return '이메일 형식을 확인해 주세요.';
    upsert('contact',m.contacts,{name:f.name.trim(),dept:f.dept.trim(),title:f.title.trim(),phone:f.phone.trim(),email:f.email.trim(),role:f.role.trim()});if(m.contacts.length===1)m.contacts[0].primary=true},
  agenda(f,m){if(!f.type)return '의안 종류를 선택해 주세요.';if(!f.res)return '결의방법을 선택해 주세요.';if(!f.ko.trim())return '의안명(국문)을 입력해 주세요.';
    upsert('agenda',m.agendas,{no:f.no.trim(),type:f.type,res:f.res,ko:f.ko.trim(),en:f.en.trim()})},
  item(f,m){if(!f.name.trim())return '장비·서비스명을 입력해 주세요.';const q=intOr(f.qty,1),p=intOr(f.price,0);
    if(q===null||q==='')return '수량은 1 이상의 정수로 입력해 주세요.';if(p===null||p==='')return '단가는 0 이상의 정수(원)로 입력해 주세요.';
    upsert('item',m.items,{kind:f.kind,name:f.name.trim(),unit:f.unit.trim(),qty:q,price:p})},
  memo(f,m){if(!f.body.trim())return '메모 내용을 입력해 주세요.';upsert('memo',m.memos,{org:f.org,rname:f.rname.trim(),body:f.body.trim()})},
  agendapaste(f,m){const rows=parseTable(f.text||'');if(!rows.length)return '붙여넣을 내용을 입력해 주세요.';
    const hd=rows[0].map(nrm),isHd=hd.some(h=>h.includes('의안명')||h.includes('결의')||h.includes('종류'));let ix;
    if(isHd){const find=fn=>hd.findIndex(fn);ix={no:find(h=>h.includes('번호')),type:find(h=>h.includes('종류')),res:find(h=>h.includes('결의')),en:find(h=>h.includes('영문')||h.includes('english')),ko:find(h=>!h.includes('영문')&&(h.includes('국문')||h.includes('의안명')))}}
    else{const n=Math.max(...rows.map(r=>r.length));ix=n>=4?{no:0,type:1,res:2,ko:3,en:4}:{no:-1,type:0,res:1,ko:2,en:-1}}
    const all=AGENDA_TYPES.flatMap(g=>g[1]),g=(r,i)=>i>=0?(r[i]||''):'';
    ui.agp={text:f.text,rows:(isHd?rows.slice(1):rows).map(r=>{const t=all.find(x=>nrm(x)===nrm(g(r,ix.type))),rs=g(r,ix.res),res=rs.includes('특별')?'특별결의':rs.includes('보통')?'보통결의':'',ko=g(r,ix.ko);

function parseTable(text){const delim=text.split('\n')[0].includes('\t')?'\t':',';const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"'&&cur==='')q=true;else if(ch===delim){row.push(cur);cur=''}
    else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur=''}else if(ch!=='\r')cur+=ch}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c))}

const normTime=v=>{const m=String(v).match(/(\d{1,2}):(\d{2})/)||String(v).trim().match(/^(\d{1,2})(\d{2})$/)||(String(v).match(/(\d{1,2})\s*시\s*(\d{1,2})?/)||[]).map((x,i)=>i===2?p2(+(x||0)):x);if(!m||m.length<3||m[1]===undefined)return null;let h=+m[1];if(/오후|pm/i.test(v)&&h<12)h+=12;return h>23||+m[2]>59?null:`${p2(h)}:${m[2]}`};

      <p class="soft" style="margin:12px 0 0;font-size:12px">열 제목으로 자동 연결했습니다. 잘못 연결된 열은 바꿔 주세요. 기업은 종목코드나 기업명으로 찾습니다.</p></div>`;
    if(sem){const ids=Object.keys(imp.sem.cnt),tot=ids.reduce((s,k)=>s+imp.sem.cnt[k],0);
      step2=maps+`<div class="card"><h3>미리보기</h3>${imp.noAtt?'<div class="err">참석 여부 열을 연결해 주세요.</div>':`
      <div class="stat"><div><b>${ids.length}</b><span>현장 참석 기업</span></div><div><b>${tot}</b><span>참석 인원</span></div><div><b>${imp.sem.miss}</b><span>기업을 찾지 못한 행</span></div></div>
      <table><thead><tr><th>기업명</th><th class="right">참석 인원</th></tr></thead><tbody>${ids.map(k=>`<tr><td>${esc(co(k)[2])}</td><td class="right mono">${imp.sem.cnt[k]}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">참석 처리된 기업이 없습니다.</td></tr>'}</tbody></table>
      <p class="soft" style="margin:12px 0 0;font-size:12px">적용하면 기존 세미나 참석 기록 전체가 이번 내용으로 바뀝니다. 현장 참석 처리된 사람만 셉니다.</p>`}
      <div class="actions"><button class="btn" data-act="impcancel">취소</button><button class="btn primary" data-act="impapply"${dis(!imp.noAtt)}>적용</button></div></div>`}
    else{const P=imp.plan,noCo=P.filter(r=>!r.co),act=P.filter(r=>r.co&&(r.chg.length||r.errs.length)),same=P.filter(r=>r.co&&!r.chg.length&&!r.errs.length).length,
      cnt=t=>P.reduce((s,r)=>s+r.chg.filter(c=>c.t===t).length,0),fmt=(c,k)=>k==='shareholders'?won(c):esc(c);
      const line=(rec,c,j)=>c.t==='new'?`<div class="chg"><span class="badge blue">담당자 추가</span>${esc(c.d.name)} <span class="mute">${esc([c.d.dept,c.d.title,c.d.phone,c.d.email].filter(Boolean).join(' · '))}</span>${c.primary?'<span class="badge blue">메인</span>':''}</div>`
        :c.t==='primary'?`<div class="chg"><span class="badge blue">메인 지정</span>${esc(c.who)}</div>`
        :`<div class="chg"><span class="badge${c.t==='conflict'?' warn':''}">${c.t==='conflict'?'값이 다름':'빈칸 채움'}</span><span class="mute">${c.who?esc(c.who)+' ':''}${FLABEL[c.k]}</span>${c.t==='conflict'?`<span class="old">${fmt(c.old,c.k)}</span> →`:''} ${fmt(c.nv,c.k)}
          ${c.t==='conflict'?`<label><input type="checkbox" data-pick="${rec.i}:${j}"${imp.pick[rec.i+':'+j]?' checked':''}>새 값으로 바꾸기</label>`:''}</div>`;
      step2=maps+`<div class="card"><h3>미리보기</h3>
      <div class="stat"><div><b>${cnt('new')}</b><span>담당자 추가</span></div><div><b>${cnt('fill')}</b><span>빈칸 채움</span></div><div><b>${cnt('conflict')}</b><span>값이 달라 선택 필요</span></div><div><b>${same}</b><span>변경 없는 행</span></div><div><b>${noCo.length}</b><span>기업을 찾지 못한 행</span></div></div>
      ${act.length?`<table><thead><tr><th style="width:180px">기업</th><th>바뀌는 내용</th></tr></thead><tbody>${act.map(rec=>`<tr><td class="wrap" style="vertical-align:top">${esc(rec.co[2])}<div class="mono soft" style="font-size:12px">${rec.co[1]}</div></td>
        <td class="wrap">${rec.chg.map((c,j)=>line(rec,c,j)).join('')}${rec.errs.map(x=>`<div class="chg" style="color:var(--critical)">${esc(x)}</div>`).join('')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">반영할 내용이 없습니다.</div>'}
      ${noCo.length?`<p style="margin:12px 0 0;color:var(--warning);font-size:12px">기업을 찾지 못해 건너뛰는 행: ${noCo.map(r=>esc(r.label)||'(이름 없음)').join(', ')}</p>`:''}
      <p class="soft" style="margin:12px 0 0;font-size:12px">값이 다른 칸은 체크한 것만 새 값으로 바뀌고, 체크하지 않으면 기존 값을 유지합니다. 빈칸은 자동으로 채웁니다.</p>
      <div class="actions"><button class="btn" data-act="impcancel">취소</button><button class="btn primary" data-act="impapply"${dis(act.length)}>적용</button></div></div>`}}
  return `<div class="page"><div class="head"><div><h1>가져오기</h1><p class="mute" style="margin:4px 0 0">구글 시트에서 범위를 복사해 붙여넣거나 CSV 파일을 올립니다. 적용 전에 바뀌는 내용을 확인합니다.</p></div></div>
  <div class="tabs" style="margin-top:0"><a href="#/import" data-act="impkind" data-kind="sheet" class="${sem?'':'on'}">영업·주총 시트</a><a href="#/import" data-act="impkind" data-kind="seminar" class="${sem?'on':''}">세미나 참석</a></div>
  <form class="card" data-form="import" novalidate><h3>${sem?'세미나 참석 명단':'고객사 담당자, 주총일·장소'}</h3>
  <textarea name="text" id="imptext" style="min-height:160px;font-family:var(--mono);letter-spacing:0;font-size:12px;white-space:pre" placeholder="첫 줄은 열 제목이어야 합니다. 시트에서 제목 줄을 포함해 복사한 뒤 붙여넣으세요.">${esc(imp.text)}</textarea>
  <div class="row" style="margin-top:12px"><label class="f"><span>또는 CSV 파일</span><input type="file" id="impfile" accept=".csv,.tsv,.txt"></label>
  <span class="fix"><button type="button" class="btn" data-act="impsample">예시 넣기</button> <button class="btn primary">분석</button></span></div>
  <p class="soft" style="margin:12px 0 0;font-size:12px">${sem?'세미나 사전등록 DB에서 내려받은 명단을 넣습니다. 기업별로 현장 참석 인원을 셉니다.':'영업 시트(담당자)와 주총일·장소 시트를 같은 방식으로 넣습니다. 한 시트에 둘 다 있어도 되고, 나눠서 따로 넣어도 기업 기준으로 합쳐집니다.'}</p>
  <div class="err"></div></form>${step2}
  <div class="card"><h3>가져오기 이력</h3>${db.imports.length?db.imports.slice(0,10).map(l=>`<div class="chk"><span class="t">${l.kind==='seminar'?'세미나 참석':'영업·주총 시트'} · ${l.rows}행 중 ${l.applied}건 반영</span><span class="soft" style="font-size:12px">${esc(l.by)} · ${stampStr(l.at)}</span></div>`).join(''):'<div class="empty">이력이 없습니다.</div>'}
  ${db.seminarAt?`<p class="soft" style="margin:12px 0 0;font-size:12px">세미나 참석 기록 기준 시각: ${stampStr(db.seminarAt)}</p>`:''}</div></div>`}

/* ---------- 계정 관리 (관리자) ---------- */
function accounts(){if(!db.accounts)db.accounts=USERS.map(u=>({id:nid(),name:u.name,org:u.org,role:u.role||'',loginId:u.loginId,status:'issued',issuedAt:new Date().toISOString()}));return db.accounts}
function viewAccounts(){const A=accounts(),st={issued:'<span class="badge blue">발급됨</span>',pending:'<span class="badge warn">미발급</span>',inactive:'<span class="badge">비활성</span>'};
  const cs=[];Object.keys(db.m).forEach(cid=>{const c=co(cid);if(c)db.m[cid].contacts.forEach(x=>cs.push({c,x}))});
  return `<div class="page"><div class="head"><div><h1>계정 관리</h1><p class="mute" style="margin:4px 0 0">이용자 계정을 일괄 등록하고 발급 상태를 관리합니다. 공개 회원가입은 없습니다.</p></div></div>
  <div class="card"><h3>이용자 계정 <span class="mute">IR큐더스·스트리밍코리아 ${A.length}명</span></h3>
  <table><thead><tr><th>이름</th><th>소속</th><th>역할</th><th>로그인 ID</th><th>상태</th><th>발급일</th><th></th></tr></thead><tbody>
  ${A.map(a=>`<tr><td>${esc(a.name)}</td><td>${ORG[a.org]}</td><td class="mute">${ROLE[a.role]||'<span class="soft">—</span>'}</td><td class="mono">${esc(a.loginId)}</td><td>${st[a.status]}</td><td class="soft" style="font-size:12px">${a.issuedAt?stampStr(a.issuedAt):'—'}</td>
  <td class="right">${a.status==='pending'?`<button class="btn sm" data-act="acct" data-id="${a.id}" data-to="issued">발급 처리</button>`:a.status==='issued'?`<button class="btn sm" data-act="acct" data-id="${a.id}" data-to="inactive">비활성</button>`:`<button class="btn sm" data-act="acct" data-id="${a.id}" data-to="issued">다시 활성</button>`}</td></tr>`).join('')}</tbody></table>
  <form data-form="acctadd" novalidate style="margin-top:16px;border-top:1px solid var(--hairline);padding-top:16px"><h3 style="margin-bottom:12px">일괄 등록</h3>
  <textarea name="text" style="font-family:var(--mono);letter-spacing:0;font-size:12px" placeholder="한 줄에 한 명씩: 이름, 소속, 역할, 로그인 ID&#10;홍운영, IR큐더스, 운영, irk-ops2&#10;강송출, 스트리밍코리아, , sk-02"></textarea>
  <p class="soft" style="margin:8px 0 0;font-size:12px">등록하면 "미발급" 상태로 들어갑니다. 계정 정보를 전달한 뒤 "발급 처리"를 누릅니다. 전달 경로와 비밀번호 초기화 방식은 담당자 검토에서 정합니다.</p>
  <div class="err"></div><div class="actions"><button class="btn primary">일괄 등록</button></div></form></div>
  <div class="card"><h3>고객사 담당자 계정 <span class="mute">발급 예정 ${cs.filter(v=>v.x.planned).length}명 / 전체 ${cs.length}명</span></h3>
  ${cs.length?`<table><thead><tr><th>기업</th><th>담당자</th><th>부서·직급</th><th>이메일</th><th>발급 예정</th></tr></thead><tbody>
  ${cs.map(({c,x})=>`<tr><td>${esc(c[2])}</td><td>${esc(x.name)} ${x.primary?'<span class="badge blue">메인</span>':''}</td><td class="mute">${esc([x.dept,x.title].filter(Boolean).join(' · '))}</td><td>${esc(x.email)||'<span class="soft">—</span>'}</td>
  <td><input type="checkbox" data-act="plan" data-cid="${c[0]}" data-id="${x.id}"${x.planned?' checked':''}></td></tr>`).join('')}</tbody></table>`:'<div class="empty">등록된 고객사 담당자가 없습니다. 가져오기에서 영업 시트를 올리면 여기에 나타납니다.</div>'}
  <p class="soft" style="margin:12px 0 0;font-size:12px">고객사 로그인은 2차 범위입니다. 지금은 발급할 대상만 표시해 둡니다.</p></div></div>`}

const GLOBAL_FORMS={
  import(f){const rows=parseTable(f.text||'');if(rows.length<2)return '제목 줄과 내용이 한 줄 이상 있어야 합니다.';
    const imp=ui.imp;imp.text=f.text;imp.headers=rows[0];imp.data=rows.slice(1).map(r=>rows[0].map((_,i)=>r[i]||''));imp.map=autoMap(rows[0],imp.kind);imp.pick={};
    if(!imp.map.includes('code')&&!imp.map.includes('company'))return '기업을 찾을 열(종목코드 또는 기업명)이 없습니다. 제목 줄을 포함해 붙여넣었는지 확인해 주세요.';
    analyze();render();document.querySelector('.maps')?.scrollIntoView({block:'start'})},
  acctadd(f){const rows=parseTable(f.text||'');if(!rows.length)return '등록할 내용을 입력해 주세요.';const A=accounts(),add=[];
    for(const [i,r] of rows.entries()){const [name,org,role,id]=[r[0]||'',r[1]||'',r[2]||'',r[3]||''];
      if(!name||!id)return `${i+1}번째 줄: 이름과 로그인 ID는 필수입니다.`;
      if(A.concat(add).some(a=>a.loginId===id))return `${i+1}번째 줄: 로그인 ID "${id}" 가 이미 있습니다.`;
      const o=org.includes('스트리밍')?'streaming':'irk',rk=Object.keys(ROLE).find(k=>role.includes(ROLE[k]))||'';
      add.push({id:nid(),name,org:o,role:o==='irk'?rk:'',loginId:id,status:'pending',issuedAt:null})}
    A.push(...add);commit(`${add.length}명을 미발급 상태로 등록했습니다`)}
};
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.map!==undefined){const imp=ui.imp,i=+t.dataset.map;if(t.value)imp.map=imp.map.map((v,j)=>j!==i&&v===t.value?'':v);imp.map[i]=t.value;imp.pick={};analyze();render()}
  else if(t.dataset.pick){ui.imp.pick[t.dataset.pick]=t.checked}
  else if(t.id==='impfile'&&t.files[0]){t.files[0].text().then(x=>{ui.imp={kind:ui.imp.kind,text:x};render()})}});
document.addEventListener('input',e=>{if(e.target.id==='imptext')ui.imp.text=e.target.value});

render();
</script>
</body>
</html>
